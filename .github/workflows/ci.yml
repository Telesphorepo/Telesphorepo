name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs run on Blacksmith. Two of its caches need no steps: the Go build cache (so setup-go
# caches nothing), and the images that a job pulls (the e2e client images). Docker builds go
# through setup-docker-builder, whose BuildKit state, layers and RUN --mount=type=cache caches
# alike, stays on a disk between runs; every image job shares the key telesphorepo-image.
jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404 # one runner label per job; change it here to switch runner provider
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-bun-cache
          path: ~/.bun/install/cache
      - name: Build UI and binary
        run: go tool task build
      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e/...
          go vet -tags import ./e2e/...
          go vet -tags scale ./e2e/...
          go vet -tags clients ./e2e/...
          go vet -tags macos ./e2e/...
      - name: Type-check and bundle the edge Worker
        working-directory: edge
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run build
      - name: Vet and build the CLI for macOS and Windows
        run: |
          for os in darwin windows; do
            GOOS=$os go vet ./cmd/telesphorepo
            GOOS=$os go build -o /dev/null ./cmd/telesphorepo
          done
      - name: Check the database
        run: bin/telesphorepo-server dbcheck

  # The core zone runs on four machines at once, each with a quarter of its tests
  # (go tool task test --shard).
  e2e-core:
    needs: build
    runs-on: blacksmith-8vcpu-ubuntu-2404 # one runner label per job; change it here to switch runner provider
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: telesphorepo-image
      - name: Run shard ${{ matrix.shard }} of the core e2e zone
        shell: bash
        run: go tool task test --shard ${{ matrix.shard }}/4 2>&1 | tee e2e-core.log
      - name: Upload the test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-core-log-${{ matrix.shard }}
          path: e2e-core.log

  # The CLI publishes from this job with the identity token of GitHub Actions (TestCLIGitHubActions).
  # A pull request from a fork gets no identity token, so the job runs only for this repository.
  e2e-github-actions:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404 # one runner label per job; change it here to switch runner provider
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: telesphorepo-image
      - name: Publish with the Telesphorepo CLI from GitHub Actions
        shell: bash
        env:
          E2E_GITHUB_ACTIONS: "1" # the test fails, not skips, without an identity token
        run: go tool task test clients -run 'TestCLIGitHubActions$' 2>&1 | tee e2e-github-actions.log
      - name: Upload the test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-github-actions-log
          path: e2e-github-actions.log

  # Every green push to main publishes ghcr.io/telesphorepo/telesphorepo:main (moving) and
  # :sha-<short> (fixed). Version tags and latest come only from release.yml.
  snapshot-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e-core
    runs-on: blacksmith-4vcpu-ubuntu-2404 # one runner label per job; change it here to switch runner provider
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: telesphorepo-image
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/telesphorepo/telesphorepo
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
