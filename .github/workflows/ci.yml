name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest # one runner label per job; change it here to switch runner provider
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - name: Build UI and binary
        run: go tool task build
      - name: Vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e/...
          go vet -tags import ./e2e/...
          go vet -tags scale ./e2e/...
          go vet -tags clients ./e2e/...
          go vet -tags edge ./e2e/...
          go vet -tags macos ./e2e/...
      - name: Type-check and bundle the edge Worker
        working-directory: edge
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run build
      - name: Vet and build the CLI for macOS and Windows
        run: |
          for os in darwin windows; do
            GOOS=$os go vet ./cmd/telesphorepo
            GOOS=$os go build -o /dev/null ./cmd/telesphorepo
          done
      - name: Check the database
        run: bin/telesphorepo-server dbcheck

  e2e-core:
    needs: build
    runs-on: ubuntu-latest # one runner label per job; change it here to switch runner provider
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - name: Run the core e2e zone
        shell: bash
        run: go tool task test 2>&1 | tee e2e-core.log
      - name: Upload the test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-core-log
          path: e2e-core.log

  # The CLI publishes from this job with the identity token of GitHub Actions (TestCLIGitHubActions).
  # A pull request from a fork gets no identity token, so the job runs only for this repository.
  e2e-github-actions:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest # one runner label per job; change it here to switch runner provider
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - name: Publish with the Telesphorepo CLI from GitHub Actions
        shell: bash
        env:
          E2E_GITHUB_ACTIONS: "1" # the test fails, not skips, without an identity token
        run: go tool task test clients -run 'TestCLIGitHubActions$' 2>&1 | tee e2e-github-actions.log
      - name: Upload the test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-github-actions-log
          path: e2e-github-actions.log

  # The path from a home bucket put to a regional copy needs R2 event notifications, which local R2
  # does not send (TestEdgeCloudflare). The job runs against the maintainer's Cloudflare account
  # from the repository secrets, so a pull request from a fork skips it. The test makes its
  # buckets, queue, notification rule and Worker with names of the run and removes them.
  e2e-edge-cloudflare:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest # one runner label per job; change it here to switch runner provider
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - name: Install the edge Worker dependencies
        working-directory: edge
        run: bun install --frozen-lockfile
      - name: Copy a blob to a region through a real R2 notification
        shell: bash
        env:
          E2E_CLOUDFLARE: "1" # the test fails, not skips, without the account
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_R2_ACCESS_KEY_ID: ${{ secrets.E2E_R2_ACCESS_KEY_ID }}
          E2E_R2_SECRET_ACCESS_KEY: ${{ secrets.E2E_R2_SECRET_ACCESS_KEY }}
        run: go tool task test edge -run 'TestEdgeCloudflare$' 2>&1 | tee e2e-edge-cloudflare.log
      - name: Upload the test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-edge-cloudflare-log
          path: e2e-edge-cloudflare.log

  # Every green push to main publishes ghcr.io/telesphorepo/telesphorepo:main (moving) and
  # :sha-<short> (fixed). Version tags and latest come only from release.yml.
  snapshot-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e-core
    runs-on: ubuntu-latest # one runner label per job; change it here to switch runner provider
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/telesphorepo/telesphorepo
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max