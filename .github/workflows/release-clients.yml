# Releases the publisher clients (spec §7.6) when a tag clients-v<version> is pushed, e.g.
# clients-v0.2.0. Both clients get the version from the tag. A version with -SNAPSHOT fails.
#
#   - the Gradle settings plugin com.telesphorepo (clients/gradle), with its plugin marker
#   - com.telesphorepo:telesphorepo-maven-extension and telesphorepo-maven-plugin (clients/maven)
#     with their client library and parent pom
# They go to the owner's Nexus release repository. The Gradle Plugin Portal and Maven Central
# jobs are at the end of this file as comments. Enable them after namespace verification.
#
# Repository secrets (Nexus):
#   NEXUS_MAVEN_URL   Full URL of the hosted Maven release repository,
#                     e.g. https://nexus.example.com/repository/maven-releases/
#   NEXUS_USERNAME    User that may deploy to that repository.
#   NEXUS_PASSWORD    Password (or user token) of that user.
#
# Repository secrets (Portal and Central, for the disabled jobs):
#   GRADLE_PUBLISH_KEY      API key of the Gradle Plugin Portal account (plugins.gradle.org,
#                           account page, "API Keys").
#   GRADLE_PUBLISH_SECRET   The secret of that API key.
#   MAVEN_CENTRAL_USERNAME  User token name from central.sonatype.com ("View Account",
#                           "Generate User Token"). The namespace com.telesphorepo must be
#                           verified on that account.
#   MAVEN_CENTRAL_PASSWORD  User token password from the same page.
#   MAVEN_GPG_PRIVATE_KEY   ASCII-armored private key that signs the Maven artifacts
#                           (gpg --armor --export-secret-keys <id>). Publish its public key to
#                           keys.openpgp.org, because Maven Central checks the signatures.
#   MAVEN_GPG_PASSPHRASE    The passphrase of that key.
name: release-clients

on:
  push:
    tags:
      - "clients-v*"

permissions:
  contents: read

jobs:
  gradle-plugin:
    name: Gradle plugin to Nexus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"
      - name: Publish
        working-directory: clients/gradle
        env:
          # build.gradle.kts adds the maven-publish repository "release" from these variables.
          NEXUS_MAVEN_URL: ${{ secrets.NEXUS_MAVEN_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#clients-v}"
          case "$version" in
            ""|*-SNAPSHOT) echo "Tag $GITHUB_REF_NAME has no final version"; exit 1 ;;
          esac
          # Publishes the plugin jar and the plugin marker com.telesphorepo.gradle.plugin.
          gradle --no-daemon --console=plain publishAllPublicationsToReleaseRepository -Pversion="$version"

  maven-extension:
    name: Maven extension and plugin to Nexus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          # Writes ~/.m2/settings.xml with the server "release". The deploy step below
          # reads the credentials from these variables.
          server-id: release
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD
      - name: Set the version from the tag
        working-directory: clients/maven
        run: |
          version="${GITHUB_REF_NAME#clients-v}"
          case "$version" in
            ""|*-SNAPSHOT) echo "Tag $GITHUB_REF_NAME has no final version"; exit 1 ;;
          esac
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$version" -DgenerateBackupPoms=false
      - name: Deploy
        working-directory: clients/maven
        env:
          NEXUS_MAVEN_URL: ${{ secrets.NEXUS_MAVEN_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: mvn -B -ntp deploy -DaltDeploymentRepository="release::${NEXUS_MAVEN_URL}"

