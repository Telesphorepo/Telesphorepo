name: Release

on:
  push:
    tags: ["v*"]

jobs:
  binaries:
    runs-on: blacksmith-4vcpu-ubuntu-2404 # one runner label per job; change it here to switch runner provider
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # Blacksmith caches Go builds itself
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - name: Build the archives
        run: go tool task release "${GITHUB_REF_NAME#v}"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" bin/release/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease

  # The darwin server and CLI on a real Mac: install.sh installs the CLI, which sets up and
  # publishes a Maven and a raw project (e2e/macos_test.go).
  # GitHub's macOS runner: free for this public repository, and the job runs only for a release.
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Maven
        run: command -v mvn || brew install maven
      - name: Build the server
        run: go tool task build
      - name: Set up and publish with the CLI
        run: go test -tags macos -count=1 -timeout 30m -v -run TestMacOS ./e2e/
        env:
          E2E_SERVER_BIN: ${{ github.workspace }}/bin/telesphorepo-server

  image:
    runs-on: blacksmith-4vcpu-ubuntu-2404 # one runner label per job; change it here to switch runner provider
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: telesphorepo-image
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/telesphorepo/telesphorepo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
