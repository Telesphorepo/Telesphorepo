# Cargo module data layer: the kernel schema plus the cargo_* tables. Run "go tool task gen" after
# editing queries/ or schema.sql.
version: "2"
sql:
  - engine: sqlite
    schema: ["../db/schema.sql", "schema.sql"]
    queries: queries
    gen:
      go:
        package: dbq
        out: dbq
        sql_package: database/sql
        emit_json_tags: false
        omit_unused_structs: true
