# Debian plugin data layer (spec §5.5): the core schema plus the deb_* tables. Run
# "go tool task gen" after editing queries/ or migrations/.
version: "2"
sql:
  - engine: sqlite
    schema: ["../db/migrations", "migrations"]
    queries: queries
    gen:
      go:
        package: dbq
        out: dbq
        sql_package: database/sql
        emit_json_tags: false
        omit_unused_structs: true
