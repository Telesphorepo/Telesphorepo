# Network module data layer: the kernel schema plus the module's migrations. Run "go tool task gen"
# after editing queries/ or migrations/.
version: "2"
sql:
  - engine: sqlite
    schema: ["../db/migrations", "migrations"]
    queries: queries
    gen:
      go:
        package: dbq
        out: dbq
        sql_package: database/sql
        emit_json_tags: false
        omit_unused_structs: true
        overrides:
          - column: users.disabled
            go_type: bool
          - column: repos.anonymous_read
            go_type: bool